name: Blender extension
on: [push, pull_request, workflow_dispatch]
jobs:
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Blender 5.2.1 LTS
        run: |
          curl --fail --location https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output blender.tar.xz
          tar -xf blender.tar.xz
          sudo apt-get update
          sudo apt-get install -y libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1
      - name: Check extension
        run: python tools/check.py --blender "$PWD/blender-5.2.1-linux-x64/blender"
      - uses: actions/upload-artifact@v4
        with:
          name: hand-posing
          path: dist/
